name: INT Branch Preview

# Runs on every push to INT and can be triggered manually.
# Deploys the site to /int/ on GitHub Pages so it can be reviewed
# at swisstopo.github.io/topo-drought-briefing/int/ before merging to main.

on:
  push:
    branches:
      - INT
  workflow_dispatch:

# INT runs can cancel each other — no risk of half-deploying production.
concurrency:
  group: pages-int
  cancel-in-progress: true

jobs:
  build-and-deploy-int:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout INT branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: INT

      - name: Set up Python 3.12
        id: setup-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        continue-on-error: true
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Python 3.12 (retry without cache)
        if: steps.setup-python.outcome == 'failure'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e .

      # -----------------------------------------------------------------------
      # Pipeline: download → aggregate → validate → generate site
      # -----------------------------------------------------------------------

      - name: Download raw datasets
        run: python scripts/download.py

      - name: Aggregate and evaluate
        run: python scripts/aggregate.py

      - name: Validate processed outputs
        run: python scripts/validate.py

      - name: Generate static site
        run: python scripts/generate_site.py

      # -----------------------------------------------------------------------
      # Publish to GitHub Pages at /int/ — does not touch the main site (/).
      # keep_files: true means only /int/ is updated; everything else stays.
      # -----------------------------------------------------------------------

      - name: Deploy INT preview to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination_dir: int
          keep_files: true
          commit_message: "deploy INT preview: ${{ github.sha }}"
